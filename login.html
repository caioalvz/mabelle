<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<title>Mabelle - Login</title>
	<link rel="stylesheet" href="css/styles.css">
</head>
<body>

	<style>
		main {
			display: flex;
    		flex-direction: column;
   			align-items: center;
   			justify-content: center;
			min-height: 86vh;
			}
	</style>
	<main>
		<h1>Login</h1>
		<p>Entre com seu usuário e senha para acessar o painel.</p>

		<form action="dashboard.html" method="get">
			<label for="usuario">Usuário</label>
			<input type="text" id="usuario" name="usuario">

			<label for="senha">Senha</label>
			<input type="password" id="senha" name="senha">

			<input type="submit" value="Entrar">
		</form>
	</main>

	<footer>
		<p>Mabelle Enxovais - Todos os direitos reservados © <span id="ano"></span></p>
		<p>Desenvolvido por <a href="https://github.com/caioalvz" class="github-link" target="_blank" rel="noopener">@caioalvz</a></p>
	</footer>

	<script src="js/script.js"></script>
</body>
</html>
